{% extends "shopping/layout.html" %}

{% block body %}
    <h1>Add Item</h1>
    <form action="{% url 'shopping:add page' %}" method="post">
        {% csrf_token %}
        {{form}}
        {% comment %} <input type="text" name="item"> {% endcomment %}
        <br>
        <input type="submit" value="Submit">
    </form>
    <a href="{% url 'shopping:index' %}"> Items <a><br>
    <a href="{% url 'index' %}"> From previous lecture <a>
{% endblock %}
