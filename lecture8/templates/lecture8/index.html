<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello from template</title>
</head>
<body>
    {% comment %} <h1>Hello, {{name.capitalize}}</h1> {% endcomment %}
    {% if name %}
        <h1>Hello, {{name.capitalize}}</h1>
    {% else %}
         <h1>Hello</h1>
    {% endif %}

</body>
</html>
